name: Format Vertex Branch

on:
  push:
    branches:
      - feature/vertex-express

permissions:
  contents: write

jobs:
  prettier:
    if: "${{ !contains(github.event.head_commit.message, 'style: apply prettier') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/vertex-express
      - uses: pnpm/action-setup@v5
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "**/*.{ts,tsx,js,mjs,css,json,md,yml,yaml}"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: apply prettier"
            git push origin HEAD:feature/vertex-express
          fi
