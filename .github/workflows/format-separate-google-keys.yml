name: Format separate Google API keys

on:
  push:
    branches:
      - feature/vertex-express

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/vertex-express
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/types/settings.ts src/constants/settingsDefaults.ts src/schemas/appSettingsSchema.ts src/stores/settingsStore.ts src/hooks/settings/useSettingsLogic.ts src/utils/api/apiKeySelection.ts src/components/settings/sections/ApiConfigSection.tsx src/components/settings/sections/providers/GeminiProviderDetail.tsx src/i18n/translations/settings/api.ts src/constants/settingsDefaults.test.ts src/schemas/appSettingsSchema.test.ts src/hooks/settings/useSettingsLogic.test.tsx src/utils/api/apiKeySelection.test.ts src/components/settings/sections/ApiConfigSection.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/settings.ts src/constants/settingsDefaults.ts src/schemas/appSettingsSchema.ts src/stores/settingsStore.ts src/hooks/settings/useSettingsLogic.ts src/utils/api/apiKeySelection.ts src/components/settings/sections/ApiConfigSection.tsx src/components/settings/sections/providers/GeminiProviderDetail.tsx src/i18n/translations/settings/api.ts src/constants/settingsDefaults.test.ts src/schemas/appSettingsSchema.test.ts src/hooks/settings/useSettingsLogic.test.tsx src/utils/api/apiKeySelection.test.ts src/components/settings/sections/ApiConfigSection.test.tsx
          git diff --cached --quiet || git commit -m "chore: format separate Google API keys"
          git push
